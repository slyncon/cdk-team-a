name: CI
run-name: CI / ${{ github.event_name == 'workflow_dispatch' && inputs.scenario || 'real' }} / ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Select real scans or a synthetic policy scenario'
        type: choice
        default: real
        required: true
        options:
          - real
          - clean
          - high-cvss
          - kev
          - exception-approved
          - exception-expired
          - combined-risk
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Build and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /tmp/cdk-launchpad-no-aws-config
      AWS_SHARED_CREDENTIALS_FILE: /tmp/cdk-launchpad-no-aws-credentials
    outputs:
      assembly_digest: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: Install immutable source and hashed dependencies
        run: make install
      - name: Lint, test, and scan application code and dependencies
        run: |
          make lint test audit
          test ! -s "$GITHUB_STEP_SUMMARY"
          echo "Build checks published no job summaries."
      - name: Synthesize and enforce infrastructure policy
        run: make synth
      - name: Record assembly integrity
        id: digest
        run: |
          find .build/cdk.out -type f -print0 | sort -z | xargs -0 sha256sum > .build/assembly.sha256
          echo "value=$(sha256sum .build/assembly.sha256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Save validated assembly for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claims-assembly-${{ github.sha }}
          path: |
            .build/cdk.out/
            .build/assembly.sha256
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security Scan
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario || 'real' }}
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.build/trivy-cache
    outputs:
      release_eligible: ${{ steps.decision.outputs.release_eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the validated assembly from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: claims-assembly-${{ github.sha }}
          path: .build
      - name: Verify assembly and source integrity across jobs
        id: integrity
        env:
          EXPECTED_DIGEST: ${{ needs.validate.outputs.assembly_digest }}
        run: |
          test "$(sha256sum .build/assembly.sha256 | cut -d ' ' -f 1)" = "$EXPECTED_DIGEST"
          sha256sum -c .build/assembly.sha256
          find .build/cdk.out -type f -print0 | sort -z | xargs -0 sha256sum > .build/downloaded.sha256
          cmp .build/assembly.sha256 .build/downloaded.sha256
      - name: Prepare scan inputs
        id: prepare
        run: make security-prepare
      - name: Install verified scanners and pinned official Python security rules
        id: tools
        if: env.SCENARIO == 'real'
        run: make security-tools
      - name: Semgrep - Python source
        if: always() && env.SCENARIO == 'real' && steps.tools.outcome == 'success' && steps.prepare.outcome == 'success'
        run: make semgrep
      - name: Trivy - dependencies
        if: always() && env.SCENARIO == 'real' && steps.tools.outcome == 'success' && steps.prepare.outcome == 'success'
        run: make trivy-dependencies
      - name: Trivy - CloudFormation
        if: always() && env.SCENARIO == 'real' && steps.tools.outcome == 'success' && steps.prepare.outcome == 'success'
        run: make trivy-iac
      - name: Trivy - Lambda artifact
        if: always() && env.SCENARIO == 'real' && steps.tools.outcome == 'success' && steps.prepare.outcome == 'success'
        run: make trivy-runtime
      - name: Generate CycloneDX SBOMs
        if: always() && env.SCENARIO == 'real' && steps.tools.outcome == 'success' && steps.prepare.outcome == 'success'
        run: make sbom
      - name: Show Trivy reports
        if: always() && env.SCENARIO == 'real' && steps.tools.outcome == 'success' && steps.prepare.outcome == 'success'
        run: make reports
      - name: Retrieve CISA KEV intelligence
        if: always() && env.SCENARIO == 'real' && steps.tools.outcome == 'success' && steps.prepare.outcome == 'success'
        run: make kev
      - name: Evaluate security policy and explain the decision
        id: decision
        if: always()
        env:
          SECURITY_PREREQUISITES_OK: ${{ steps.integrity.outcome == 'success' && steps.prepare.outcome == 'success' && (env.SCENARIO != 'real' || steps.tools.outcome == 'success') }}
        run: make security-decision
      - name: Save real scan reports and CycloneDX SBOMs
        if: always() && env.SCENARIO == 'real'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-REAL-${{ github.sha }}-${{ github.run_id }}
          path: .build/security/real/
          if-no-files-found: error
          retention-days: 7
      - name: Save scenario report
        if: always() && env.SCENARIO != 'real'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ env.SCENARIO }}-${{ github.run_id }}
          path: .build/security/synthetic/
          if-no-files-found: error
          retention-days: 7

  release-eligible:
    # Always execute so GitHub resolves the display name even for synthetic runs.
    # Synthetic runs must never replace the required genuine check context.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario != 'real' && 'Release withheld' || 'Release eligible' }}
    needs: [validate, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check release eligibility
        env:
          SOURCE_SHA: ${{ github.sha }}
          ASSEMBLY_DIGEST: ${{ needs.validate.outputs.assembly_digest }}
          SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario || 'real' }}
          APPROVED: ${{ needs.validate.result == 'success' && needs.security.result == 'success' && needs.security.outputs.release_eligible == 'true' }}
        run: |
          if [ "$SCENARIO" != 'real' ]; then
            echo "Release withheld for scenario $SCENARIO."
            exit 0
          fi
          if [ "$APPROVED" != 'true' ]; then
            echo "Release blocked: genuine validation and security approval are required."
            exit 1
          fi
          echo "Approved commit $SOURCE_SHA and assembly manifest $ASSEMBLY_DIGEST"
