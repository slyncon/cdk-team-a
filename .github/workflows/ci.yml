name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'real = genuine scans; all other options = SYNTHETIC / PRESENTATION ONLY'
        type: choice
        default: real
        required: true
        options:
          - real
          - clean
          - high-cvss
          - kev
          - exception-approved
          - exception-expired
          - combined-risk
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Validate team
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /tmp/cdk-launchpad-no-aws-config
      AWS_SHARED_CREDENTIALS_FILE: /tmp/cdk-launchpad-no-aws-credentials
    outputs:
      assembly_digest: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Install immutable source and hashed dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -r requirements.txt
          python -m pip check
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Lint, test, and scan application code and dependencies
        run: |
          python -m ruff check .
          python -m pytest -q
          python -m bandit -r handler app.py stack.py scripts -ll
          python -m pip_audit --require-hashes --disable-pip -r requirements.lock
          npm audit --audit-level=high
      - name: Synthesize and enforce infrastructure policy
        run: |
          cdk synth
          cdk-launchpad-validate .build/cdk.out
          python scripts/check_assembly.py .build/cdk.out
      - name: Record assembly integrity
        id: digest
        run: |
          find .build/cdk.out -type f -print0 | sort -z | xargs -0 sha256sum > .build/assembly.sha256
          echo "value=$(sha256sum .build/assembly.sha256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Save validated assembly for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claims-assembly-${{ github.sha }}
          path: |
            .build/cdk.out/
            .build/assembly.sha256
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security Scan
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario || 'real' }}
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.build/trivy-cache
    outputs:
      release_eligible: ${{ steps.decision.outputs.release_eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the validated assembly from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: claims-assembly-${{ github.sha }}
          path: .build
      - name: Verify assembly and source integrity across jobs
        id: integrity
        env:
          EXPECTED_DIGEST: ${{ needs.validate.outputs.assembly_digest }}
        run: |
          test "$(sha256sum .build/assembly.sha256 | cut -d ' ' -f 1)" = "$EXPECTED_DIGEST"
          sha256sum -c .build/assembly.sha256
          find .build/cdk.out -type f -print0 | sort -z | xargs -0 sha256sum > .build/downloaded.sha256
          cmp .build/assembly.sha256 .build/downloaded.sha256
          python scripts/security_prepare.py
      - name: Install verified scanners and pinned official Python security rules
        id: tools
        if: env.SCENARIO == 'real'
        run: bash scripts/security_tools.sh
      - name: Run Semgrep, Trivy, SBOM generation and official CISA retrieval
        if: env.SCENARIO == 'real'
        run: bash scripts/security_scan.sh
      - name: Evaluate security policy and explain the decision
        id: decision
        if: always()
        env:
          SECURITY_PREREQUISITES_OK: ${{ steps.integrity.outcome == 'success' && (env.SCENARIO != 'real' || steps.tools.outcome == 'success') }}
        run: python scripts/security_gate.py --scenario "$SCENARIO"
      - name: Save real scan reports and CycloneDX SBOMs
        if: always() && env.SCENARIO == 'real'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-REAL-${{ github.sha }}-${{ github.run_id }}
          path: .build/security/real/
          if-no-files-found: error
          retention-days: 7
      - name: Save synthetic presentation decision
        if: always() && env.SCENARIO != 'real'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-SYNTHETIC-${{ env.SCENARIO }}-${{ github.run_id }}
          path: .build/security/synthetic/
          if-no-files-found: error
          retention-days: 7

  release-eligible:
    # Skipped checks count as successful in branch protection. Synthetic runs must
    # never create/replace the required genuine 'Release eligible' check context.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario != 'real' && 'SYNTHETIC - no release approval' || 'Release eligible' }}
    needs: [validate, security]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.scenario == 'real')
    runs-on: ubuntu-latest
    steps:
      - name: Record approval of this commit and validated artifact (no deployment)
        env:
          SOURCE_SHA: ${{ github.sha }}
          ASSEMBLY_DIGEST: ${{ needs.validate.outputs.assembly_digest }}
          APPROVED: ${{ needs.validate.result == 'success' && needs.security.result == 'success' && needs.security.outputs.release_eligible == 'true' }}
        run: |
          if [ "$APPROVED" != 'true' ]; then
            echo "Release blocked: genuine validation and security approval are required." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "REAL SCAN approved commit $SOURCE_SHA and assembly manifest $ASSEMBLY_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Eligibility status only. Human review is still required. No AWS access or deployment." >> "$GITHUB_STEP_SUMMARY"
