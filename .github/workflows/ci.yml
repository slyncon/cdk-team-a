name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Validate team
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /tmp/cdk-launchpad-no-aws-config
      AWS_SHARED_CREDENTIALS_FILE: /tmp/cdk-launchpad-no-aws-credentials
    outputs:
      assembly_digest: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Install immutable source and hashed dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -r requirements.txt
          python -m pip check
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Lint, test, and scan application code and dependencies
        run: |
          python -m ruff check .
          python -m pytest -q
          python -m bandit -r handler app.py stack.py scripts -ll
          python -m pip_audit --require-hashes --disable-pip -r requirements.lock
          npm audit --audit-level=high
      - name: Synthesize and enforce infrastructure policy
        run: |
          cdk synth
          cdk-launchpad-validate .build/cdk.out
          python scripts/check_assembly.py .build/cdk.out
      - name: Record assembly integrity
        id: digest
        run: |
          find .build/cdk.out -type f -print0 | sort -z | xargs -0 sha256sum > .build/assembly.sha256
          echo "value=$(sha256sum .build/assembly.sha256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Save validated assembly for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claims-assembly-${{ github.sha }}
          path: |
            .build/cdk.out/
            .build/assembly.sha256
          if-no-files-found: error
          retention-days: 7
